name: j9

# Scratch probe for case J9 (#328): job `if:` guards reading the `github.*`
# facts seeded from the pull response (#322). Opened by thekevinbot from a
# same-repo branch into main, one commit, not a draft — so every guard below
# has an unambiguous expected outcome. Closed unmerged once captured.
on:
  pull_request:

permissions: {}

jobs:
  j9-actor-match:
    if: github.actor == 'thekevinbot'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'true'

  j9-actor-miss:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'true'

  j9-base-main:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'true'

  j9-base-other:
    if: github.base_ref == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'true'

  j9-not-draft:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'true'

  j9-is-draft:
    if: github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'true'

  j9-same-repo:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'true'

  j9-from-fork:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'true'
