name: probe M2 empty dynamic axis
on:
  pull_request:
jobs:
  m2_sibling:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  m2_gate:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.emit.outputs.list }}
    steps:
      - id: emit
        run: echo 'list=[]' >> "$GITHUB_OUTPUT"
  m2_empty_dynamic:
    needs: m2_gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        a: ${{ fromJSON(needs.m2_gate.outputs.list) }}
    steps:
      - run: 'true'
