name: Testing Conventions

# Runs the upstream testing-conventions gates over this repo, pinned to the
# rolling `v0` tag (the same convention as check.yml).
#
# Every gate takes its default, which for TypeScript is a 100% floor on all
# four coverage metrics. `testing-conventions.toml` holds the only exemptions:
# co-change lifts for the #48 formatting sweep, deleted once that lands.
#
# `mutation` and `e2e-verify` are left out — mutation needs Stryker in this
# package's own deps, and there is no e2e attestation to keep fresh.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventions:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: src
      gates: '["colocated-test", "unit-lint", "unit-coverage", "integration-lint", "packaging"]'
