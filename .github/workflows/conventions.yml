name: Testing Conventions

# Runs the upstream testing-conventions gates over this repo, pinned to the
# rolling `v0` tag (the same convention as check.yml).
#
# `version` is pinned because the static job runs a bare `npx` with no
# setup-node: left empty, the runner's older Node resolves 0.0.86, not latest.
#
# Every gate runs (`gates` left at its empty default): mutation's Stryker deps
# are in devDependencies, and `e2e-attestations/` holds the receipt the
# e2e-verify gate checks.
#
# One call per workspace package (docs/monorepo.md): each `source` names that
# package's source directory and everything else — install, suite, config,
# packaging — derives by walking up to its own `package.json`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job id kept as-is: it prefixes every check name this call produces.
  conventions:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: src
      version: '0.0.96'

  record-cassette:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: scripts/record-cassette/src
      version: '0.0.96'
