name: test

# The repo's own suite: typecheck, then Vitest at the 100% coverage floor.
# `conventions.yml` enforces the same floor through testing-conventions; this
# workflow is the fast, direct signal and the one a contributor reproduces
# locally with `pnpm typecheck` and `pnpm test:coverage`.
#
# The suites are not a set of opinions about how GitHub *should* behave: every
# expectation in `src/names.test.ts` and every workflow-level verdict in
# `src/predict.test.ts` was read back off a live dispatch on
# thekevinbot/willrun-probe. See `probe/README.md`.

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: tests (100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
