name: test

# The repo's own suite, one job per kind so a red names the kind. Only the unit
# job carries the coverage floor: `src/` reaches 100% from its colocated tests
# alone, so the integration suite is not propping the number up.
#
# The suites are not a set of opinions about how GitHub *should* behave: every
# workflow-level verdict in `src/predict.test.ts` was read back off a live
# dispatch on thekevinbot/willrun-probe. See
# `tests/fixtures/willrun-probe/README.md`.

on:
  pull_request:
    # tests/e2e is excluded because no CI job reads it: the e2e suite runs
    # locally, and CI checks only its receipts under e2e-attestations/.
    paths:
      - 'src/**'
      - 'tests/**'
      - '!tests/e2e/**'
      - 'e2e-attestations/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'vitest.config.mts'
      - '.github/workflows/test.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: unit (100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

