name: PR Monitor

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  monitor:
    name: 'CI Gate'
    runs-on: ubuntu-latest
    # The action has no timeout of its own (see monitor.ts) — this is the
    # backstop. If a predicted run never dispatches, the gate waits here
    # until the job is killed.
    timeout-minutes: 20
    steps:
      - uses: thekevinscott/pr-monitor@v1
        with:
          # conventions.yml fans its jobs out over a matrix its `detect` job
          # computes, so the gate must execute `detect` (it lives in the
          # testing-conventions repo) to resolve the predicted set. Removable
          # once pr-monitor derives grants itself (thekevinscott/pr-monitor#25).
          execute: thekevinscott/testing-conventions:detect
