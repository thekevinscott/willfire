name: g-p-rep

# Scratch probe for #359: measure GitHub's filter-glob semantics against a
# real dispatch. Not for merge.
on:
  pull_request:
    paths:
      - 'c1+.txt'

permissions: {}

jobs:
  g-p-rep:
    name: g-p-rep
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'true'
