# testing-conventions config — the colocated-test, coverage and packaging rules for
# the TypeScript sources under `src/`. See https://github.com/thekevinscott/testing-conventions
#
# The coverage rule measures the whole `src/` tree against this floor. The CLI runs
# Vitest itself, so `vitest.config.mts` only scopes the local developer report, not
# what CI counts.
[typescript]
coverage = { lines = 100, branches = 100, functions = 100, statements = 100 }

# The packaging gate builds the publishable tarball before scanning it. npm
# standardizes `pack` (which runs `prepare` / `prepack`) but not the name of the
# compile script, and willfire's compile hangs off `prepublishOnly` — which `pack`
# does not run. This names it, so the gate inspects a `dist/` that actually has
# something in it.
build_command = "pnpm build"

# There is exactly one exemption, and it is not a coverage waiver. Both runtime
# modules carry a colocated test and both are fully covered. `verify.ts` is a
# top-level script — importing it runs it — which reads as untestable, but its test
# stands up argv, `process.exit` and a stubbed `predict()` and drives the whole
# script. Reach for an exemption only when a technique genuinely runs out; a waiver
# there would have hidden a hundred lines of comparison logic.
#
# Exempt paths are relative to the scanned root, i.e. to `src/`.

[[typescript.exempt]]
path = "names.test.ts"
rules = ["unmocked-collaborator"]
reason = "second unit-test file for predict.ts, named for the behaviour it pins rather than the module: `./predict.js` is its unit under test, not a collaborator, and `yaml` only builds the parsed workflow the unit takes as an argument. The rule pairs a test with a source file of the same name and there is no src/names.ts to pair with. Splitting predict.ts is tracked in #6 and #8; when name resolution moves to its own module the file gets renamed alongside it and this goes away."
