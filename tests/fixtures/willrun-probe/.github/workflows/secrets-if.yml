name: secrets-if
# Probe: does a job whose if: references secrets produce a named check either
# way — success when the secret exists, skipped when it does not?
# Answer: neither. `secrets` is not a recognized context in a job-level if:
# ("Unrecognized named-value: 'secrets'"), so this file is invalid. Observed
# on PR #16: every push gets a zero-job failure run named by this file's
# path, and the PR itself gets no secrets-if check at all — not even a
# failed one. The file is kept broken on purpose as the record.
on:
  pull_request:
    paths:
      - src/secrets-if.txt
jobs:
  secret-present:
    if: ${{ secrets.GITHUB_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo secret present
  secret-absent:
    if: ${{ secrets.DOES_NOT_EXIST != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo never
  secret-absent-named:
    name: Absent Named (${{ github.event_name }})
    if: ${{ secrets.DOES_NOT_EXIST != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo never
